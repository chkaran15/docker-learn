version: '3' # Version of YML file

services:
  # MYSQL services
  db:
    image: mysql:5.7
    container_name: mysql-container
    restart: always # IF container get crashed It auto starts
    environment:
      MYSQL_ROOT_PASSWORD: mypassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpressuser
      MYSQL_PASSWORD: wordpress
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - wordpress_network
    ports:
      - "3306:3306"
    
  # WordPress Services
  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    container_name: wordpress-container
    restart: always
    environment:
      WORDPRESS_DB_HOST: db:3305
      WORDPRESS_DB_USER:  wordpressuser
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wordpress_data:/var/www/html
    ports:
      - "8080:80"
    
# Volumes
volumes:
  mysql_data:
  wordpress_data:

# network Bridge
networks:
  wordpress_network:
    driver: bridge